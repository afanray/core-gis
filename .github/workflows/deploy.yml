name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  # -------------------------------------------------------------
  # 1. CI Stage: Automated Testing
  # -------------------------------------------------------------
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code

        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword123@localhost:5432/terragis_test_db
          SECRET_KEY: test_secret_key_jwt_ci_cd_secure_2026
        run: |
          pytest -v

  # -------------------------------------------------------------
  # 2. CD Stage: Deploy to VPS over SSH
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="~/core-gis"
            fi

            echo "📁 Entering project directory: $DEPLOY_DIR"
            cd $DEPLOY_DIR

            echo "📥 Fetching latest code from origin master..."
            git pull origin master

            echo "🐳 Rebuilding and updating Docker containers..."
            docker compose up -d --build

            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "🎉 Terra GIS Backend deployed successfully to production!"
