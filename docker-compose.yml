services:
  db:
    image: postgres:15-alpine
    container_name: terragis_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-terragis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - terra_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-terragis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terragis_api
    restart: always
    env_file:
      - .env
    ports:
      # Bind to localhost 8000 so Nginx / Caddy on VPS can proxy securely
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - terra_net

networks:
  terra_net:
    driver: bridge

volumes:
  postgres_data:
